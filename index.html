<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040f">
<title>Portal Pong</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05040f;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8f0ff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));background:rgba(5,4,15,.8);backdrop-filter:blur(3px);text-align:center;z-index:5;overflow:auto}
.hide{display:none!important}
h1{font-size:clamp(40px,11vw,72px);letter-spacing:2px;line-height:1;background:linear-gradient(90deg,#39b8ff,#fff,#ff9a2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #39b8ff88)}
p{opacity:.85;max-width:420px;line-height:1.4;font-size:15px}
.btn{min-width:240px;min-height:56px;padding:12px 22px;font-size:20px;font-weight:700;border-radius:14px;border:2px solid #39b8ff;background:#0b1a33;color:#fff;cursor:pointer;box-shadow:0 0 14px #39b8ff66}
.btn.sel{background:#39b8ff;color:#05040f}
.btn.o{border-color:#ff9a2e;box-shadow:0 0 14px #ff9a2e66}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .btn{min-width:100px}
#mode .btn{min-width:150px}
#mode .btn.sel{background:#c34bff;border-color:#c34bff;color:#fff}
small{opacity:.7;font-size:13px;max-width:420px}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;z-index:4}
#hud button{width:48px;height:48px;border-radius:12px;border:2px solid #ffffff44;background:#0b1a33cc;color:#fff;font-size:20px;cursor:pointer}
.pw{position:fixed;left:calc(8px + env(safe-area-inset-left));display:flex;gap:6px;z-index:4;pointer-events:none;flex-wrap:wrap;max-width:70vw}
#pwA{top:calc(8px + env(safe-area-inset-top))}#pwP{bottom:calc(8px + env(safe-area-inset-bottom))}
.chip{font:700 14px system-ui;padding:5px 9px;border-radius:10px;background:#0b1a33dd;border:2px solid var(--c);color:#fff;box-shadow:0 0 10px var(--c)}
.code{font:800 46px ui-monospace,monospace;letter-spacing:8px;color:#fff;text-shadow:0 0 14px #39b8ff}
input.t{font:700 22px ui-monospace,monospace;padding:12px;border-radius:12px;border:2px solid #39b8ff;background:#0b1a33;color:#fff;text-align:center;width:160px;text-transform:uppercase;letter-spacing:4px}
#roomLink{width:min(340px,86vw);font-size:13px;letter-spacing:0;text-transform:none}
#onStatus{min-height:1.4em}#onStatus.err{color:#ff6b6b}
#nst{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:4;font:700 13px system-ui;padding:6px 10px;border-radius:10px;background:#0b1a33cc;border:1px solid #ffffff33;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><button id="bPause" aria-label="Pause">⏸</button><button id="bMute" aria-label="Mute">🔊</button></div>
<div id="pwA" class="pw"></div><div id="pwP" class="pw"></div>
<div id="menu" class="ov">
 <h1>PORTAL<br>PONG</h1>
 <p>One finger (or mouse) does it all:<br><b>left/right</b> moves your paddle, <b>up/down</b> moves your <span style="color:#39b8ff">blue portal</span>. Balls entering a portal fly out of the other one. First to 7.</p>
 <div class="row" id="diff"><button class="btn" data-d="0">Easy</button><button class="btn sel" data-d="1">Normal</button><button class="btn" data-d="2">Hard</button></div>
 <div class="row" id="mode"><button class="btn sel" data-m="0">Classic</button><button class="btn" data-m="1">⚡ Power Mode</button></div>
 <small id="modeInfo">Pure Portal Pong.</small>
 <button class="btn" id="bStart">▶ Play</button>
 <button class="btn o" id="bOnline">🌐 Play online</button>
</div>
<div id="online" class="ov hide">
 <h1 style="font-size:clamp(34px,9vw,56px)">PLAY ONLINE</h1>
 <div id="onChoose" style="display:flex;flex-direction:column;gap:12px;align-items:center">
  <button class="btn" id="bCreate">＋ Create room</button>
  <div class="row"><input class="t" id="joinCode" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="bJoin">Join</button></div>
 </div>
 <div id="onRoom" class="hide" style="display:flex;flex-direction:column;gap:10px;align-items:center">
  <small>Room code</small><div class="code" id="roomCode">…</div>
  <input class="t" id="roomLink" readonly><button class="btn" id="bCopy">🔗 Copy / share link</button>
  <div class="row" id="omode"><button class="btn sel" data-m="0">Classic</button><button class="btn" data-m="1">⚡ Power Mode</button></div>
 </div>
 <p id="onStatus"></p>
 <button class="btn o" id="bOnBack">Back</button>
</div>
<div id="dc" class="ov hide"><h1 style="font-size:clamp(30px,9vw,52px)">DISCONNECTED</h1><p id="dcMsg"></p><button class="btn" id="bDcMenu">Menu</button></div>
<div id="nst" class="hide"></div>
<div id="pause" class="ov hide"><h1>PAUSED</h1><button class="btn" id="bResume">▶ Resume</button><button class="btn o" id="bQuit">Menu</button></div>
<div id="win" class="ov hide"><h1 id="winT">YOU WIN</h1><p id="winS"></p><button class="btn" id="bAgain">↻ Play again</button><button class="btn o" id="bMenu">Menu</button></div>
<script>
(()=>{
const W=600,H=900,PW=110,PH=14,PY=H-50,AIY=50,PL=130,BR=9,WIN=7;
const PMIN=PL/2+30,PMAX=H-PL/2-30,PORTAL_SPD=900,COOL=0.35,CAP=1.6,MAXP=260;
const DIFF=[{spd:330,react:.28,err:70,pspd:260,use:.15},{spd:480,react:.17,err:40,pspd:420,use:.35},{spd:680,react:.09,err:18,pspd:650,use:.6}];
const COL={p:'#39b8ff',a:'#ff9a2e'};
// Power definitions: dur in seconds (0 = instant)
const POW={
 multi:{n:'MULTI-BALL',i:'⚪⚪',c:'#ffffff',d:0},
 mega:{n:'MEGA PORTAL',i:'🌀',c:'#c34bff',d:4},
 big:{n:'BIG PADDLE',i:'⬛',c:'#4dff88',d:8},
 shrink:{n:'SHRINK RAY',i:'🔻',c:'#ff4d6d',d:7},
 shield:{n:'SHIELD',i:'🛡',c:'#7af0ff',d:15},
 fire:{n:'FIREBALL',i:'🔥',c:'#ff5a1f',d:6},
 lock:{n:'PORTAL LOCK',i:'🔒',c:'#ffe14d',d:4},
 curve:{n:'CURVE SHOT',i:'↪',c:'#ff6bd6',d:10},
 slow:{n:'SLOW-MO GUARD',i:'⏳',c:'#9d8cff',d:6},
 ghost:{n:'GHOST BALL',i:'👻',c:'#b8c4ff',d:6}};
const PKEYS=Object.keys(POW);
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let dpr=1,sc=1,ox=0,oy=0;
const $=id=>document.getElementById(id);
const S={state:'menu',diff:1,power:false,ps:0,as:0,muted:false,teleports:0,
 player:{x:W/2,tx:W/2,sq:0},ai:{x:W/2,tx:W/2,t:0,sq:0},
 pPortal:{y:H/2,ty:H/2},aPortal:{y:H/2,ty:H/2,t:0},
 balls:[],parts:[],rings:[],swirls:[],orbs:[],pw:{p:{},a:{}},orbT:5,
 shake:0,hitstop:0,flash:0,combo:0,announce:null,hadInput:false,lastScorer:null,log:[]};
window.__pp=S;
const NET={role:null,peer:null,conn:null,open:false,code:null,ev:[],snaps:[],rm:{me:false,them:false},last:0,lastSend:0,lastIn:0,inDirty:false,rtt:0,status:''};S.net=NET;
const me=()=>NET.role==='guest'?'a':'p';
Object.defineProperty(S,'ball',{get:()=>S.balls[0]});
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);const w=innerWidth,h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 sc=Math.min(w/(W+20),h/(H+20));ox=(w-W*sc)/2;oy=(h-H*sc)/2;}
addEventListener('resize',resize);resize();
let ac=null;function blip(f,d=.07,type='square',v=.06,f2){if(S.muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
// ---- input (unchanged): x -> paddle, y -> portal
function onPoint(clientX,clientY){let fx=(clientX-ox)/sc,fy=(clientY-oy)/sc;S.hadInput=true;
 if(NET.role==='guest'){fx=W-fx;fy=H-fy;// guest view is rotated 180deg: map back to host coords
  S.ai.tx=Math.max(PW/2,Math.min(W-PW/2,fx));S.aPortal.ty=PMIN+(PMAX-PMIN)*Math.max(0,Math.min(1,fy/H));NET.inDirty=true;return}
 S.player.tx=Math.max(PW/2,Math.min(W-PW/2,fx));
 S.pPortal.ty=PMIN+(PMAX-PMIN)*Math.max(0,Math.min(1,fy/H));}
S.point=onPoint;
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')onPoint(e.clientX,e.clientY)});
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')onPoint(e.clientX,e.clientY)});
const tch=e=>{if(S.state==='play'){e.preventDefault();const t=e.touches[0];if(t)onPoint(t.clientX,t.clientY);}};
cv.addEventListener('touchstart',tch,{passive:false});cv.addEventListener('touchmove',tch,{passive:false});
document.addEventListener('touchmove',e=>{if(S.state==='play')e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{if(!NET.role&&(e.key==='p'||e.key==='Escape')){S.state==='play'?pause():S.state==='paused'&&resume();}});
// ---- UI
document.querySelectorAll('#diff .btn').forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;document.querySelectorAll('#diff .btn').forEach(x=>x.classList.toggle('sel',x===b));blip(500)});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(NET.role==='guest')return;S.power=b.dataset.m==='1';document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('sel',x.dataset.m===b.dataset.m));
 $('modeInfo').textContent=S.power?'Orbs spawn in the field — whoever last hit the ball that touches an orb gets its power.':'Pure Portal Pong.';blip(560)});
const show=id=>['menu','pause','win','online','dc'].forEach(k=>$(k).classList.toggle('hide',k!==id));
function start(){S.ps=S.as=0;S.teleports=0;S.player.x=S.player.tx=W/2;S.ai.x=W/2;S.pPortal.y=S.pPortal.ty=H/2;S.aPortal.y=S.aPortal.ty=H/2;
 S.parts=[];S.rings=[];S.swirls=[];S.orbs=[];S.pw={p:{},a:{}};S.orbT=4;S.combo=0;S.announce=null;S.shake=0;S.hitstop=0;S.ai.tx=W/2;serve(Math.random()<.5?1:-1);if(NET.role)S.serve=1.5;NET.rm.me=NET.rm.them=false;S.state='play';show(null);hudOn();blip(660,.12);}
function hudOn(){$('hud').classList.remove('hide');$('bPause').classList.toggle('hide',!!NET.role)}
function pause(){S.state='paused';show('pause')}function resume(){S.state='play';show(null);last=performance.now()}
$('bStart').onclick=start;$('bAgain').onclick=()=>{if(!NET.role)return start();NET.rm.me=true;netSend({t:'rm'});$('bAgain').textContent='Waiting for opponent…';checkRematch()};$('bResume').onclick=resume;$('bPause').onclick=()=>S.state==='play'?pause():S.state==='paused'&&resume();
const toMenu=()=>{S.state='menu';show('menu');$('hud').classList.add('hide');S.pw={p:{},a:{}};renderHud()};$('bQuit').onclick=toMenu;$('bMenu').onclick=()=>{if(NET.role){netSend({t:'bye'});netClose()}toMenu()};
$('bMute').onclick=()=>{S.muted=!S.muted;$('bMute').textContent=S.muted?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.state==='play'&&!NET.role)pause()});
// ---- helpers
const opp=s=>s==='p'?'a':'p';
const has=(s,k)=>S.pw[s][k]>0;
const padW=s=>PW*(has(s,'big')?1.55:1)*(has(opp(s),'shrink')?.6:1);
let bid=0;function mkBall(x,y,vx,vy,owner){return{x,y,vx,vy,cool:0,mult:1,owner:owner||null,trail:[],curve:0,id:++bid,pt:null}}
function serve(dir){S.balls=[];const a=(Math.random()-.5)*0.9,s=380;const b=mkBall(W/2,H/2,Math.sin(a)*s,Math.cos(a)*s*dir,null);S.balls.push(b);S.serve=0.8;S.combo=0;}
function spark(x,y,c,n,sp=240,life=.5){n=Math.min(n,MAXP-S.parts.length);for(let i=0;i<n;i++){const a=Math.random()*6.283,s=40+Math.random()*sp;S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*(.6+Math.random()*.6),c})}}
function ring(x,y,c,r=60,life=.35,w=4){if(S.rings.length<24)S.rings.push({x,y,c,r,l:life,L:life,w})}
function swirl(x,y,c,side){if(S.swirls.length<12)S.swirls.push({x,y,c,l:.6,side})}
const speed=b=>Math.hypot(b.vx,b.vy);
function portalSeg(side){// side 'p' left, 'a' right
 if(has(side,'mega'))return{c:H/2,h:H/2};return{c:side==='p'?S.pPortal.y:S.aPortal.y,h:PL/2};}
const mapY=(r,dst)=>Math.max(BR,Math.min(H-BR,dst.c+r*(dst.h-BR)));
// vertical offset between the two portal mouths for a ball in transit (seamless: exit copy = entry copy + (±W, dy))
function ptDy(p){return p.done||p.g?p.dy:mapY(p.r,portalSeg(opp(p.s)))-p.y0}
// twin = the part of the ball visible at the OTHER portal while it straddles a wall
function twin(b){const p=b.pt;if(!p)return null;const L=p.s==='p',dy=ptDy(p),onSrc=L?b.x<W/2:b.x>W/2;
 if(onSrc){if(L?b.x>BR:b.x<W-BR)return null;return{x:b.x+(L?W:-W),y:b.y+dy}}
 if(L?b.x<W-BR:b.x>BR)return null;return{x:b.x+(L?-W:W),y:b.y-dy}}
S.twin=twin;
function teleport(b,fromLeft){const ds=fromLeft?'a':'p',p=b.pt;
 // walls face each other, so the portal transform is a pure translation: momentum (vx,vy) is preserved as-is
 const dy=ptDy(p);p.dy=dy;p.done=true;b.x+=fromLeft?W:-W;b.y=Math.max(BR,Math.min(H-BR,b.y+dy));
 if(b.mult<CAP){const k=Math.min(1.05,CAP/b.mult);b.vx*=k;b.vy*=k;b.mult*=k;}
 b.cool=COOL;S.teleports++;fx('t',b.x,b.y,ds,fromLeft?1:0);}
// ---- powers
function givePower(side,k){const P=POW[k];if(!P)return;S.log.push(side+':'+k);
 fx('p',side,k);
 if(k==='multi'){const src=S.balls.slice(0,4);for(const b of src){if(S.balls.length>=5)break;const nb=mkBall(b.x,b.y,-b.vx||120,b.vy,b.owner);nb.mult=b.mult;nb.cool=.2;S.balls.push(nb);}ring(src[0].x,src[0].y,'#fff',80,.4,5);}
 else S.pw[side][k]=P.d;
 renderHud();}
function renderHud(){for(const s of['p','a']){const el=$(s===me()?'pwP':'pwA');let h='';for(const k in S.pw[s]){const t=S.pw[s][k];if(t>0)h+=`<span class="chip" data-k="${k}" style="--c:${POW[k].c}">${POW[k].i} ${k==='shield'?'':Math.ceil(t)+'s'}</span>`}
 if(el.innerHTML!==h)el.innerHTML=h;}}
function spawnOrb(k,x,y){k=k||PKEYS[Math.floor(Math.random()*PKEYS.length)];S.orbs.push({k,x:x??(90+Math.random()*(W-180)),y:y??(H*.3+Math.random()*H*.4),l:11,t:0});}
S.givePower=givePower;S.spawnOrb=spawnOrb;S.POW=POW;
S.agePowers=sec=>{for(const s of['p','a'])for(const k in S.pw[s])S.pw[s][k]=Math.max(0,S.pw[s][k]-sec);renderHud();};
S.forcePortal=(left=true)=>{const b=S.balls[0],p=left?S.pPortal:S.aPortal;b.cool=0;S.serve=0;b.y=p.y;b.x=left?BR+2:W-BR-2;b.vx=left?-300:300;b.vy=b.vy||200;};
S.forceScore=(playerScores=true,i=0)=>{const b=S.balls[i];if(!b)return;S.serve=0;b.x=W/2;b.vx=0;b.y=playerScores?AIY-20:PY+20;b.vy=playerScores?-600:600;b.cool=1;S.pw.p.shield=0;S.pw.a.shield=0;};
// ---- paddle hit
function paddleHit(b,px,top){const side=top?'a':'p',w=padW(side),off=Math.max(-1,Math.min(1,(b.x-px)/(w/2+BR)));
 let sp=Math.min(speed(b)*1.04,1400);const a=off*1.05;
 b.vx=Math.sin(a)*sp;b.vy=Math.cos(a)*sp*(top?1:-1);if(Math.abs(b.vy)<sp*.45)b.vy=Math.sign(b.vy)*sp*.45;
 b.owner=side;b.curve=has(side,'curve')?(off>=0?-1:1)*700:0;
 S.combo++;fx('h',b.x,b.y,side,sp,S.combo);}
// ---- shared effects (run locally; host also forwards them to the guest). v3: ~45% softer than v2
const FX={
 h(x,y,side,sp,combo){const k=Math.min(1,combo/12),c=COL[side];
  spark(x,y,c,6+Math.round(k*12),140+k*150,.3+k*.2);
  ring(x,y,c,34+sp*.03+k*34,.26,2.5+k*2);if(combo>=5)ring(x,y,'#fff',20+k*50,.32,1.5);
  S.shake=Math.min(7,S.shake+sp/320+k*2);S.flash=Math.min(.12,.02+sp/10000+k*.05);
  if(sp>1150)S.hitstop=.018;// only very fast hits get a tiny freeze
  (side==='a'?S.ai:S.player).sq=.7;
  blip((side==='a'?330:440)*(1+Math.min(combo,12)*.06),.07,'square',.05);},
 w(){blip(220,.04)},
 t(x,y,ds,fromLeft){spark(x,y,COL[ds],4,110,.3);blip(fromLeft?880:740,.14,'sine',.04,fromLeft?520:440);},
 s(x,y,player){const c=player?COL.p:COL.a,good=me()==='p'?player:!player;spark(x,y,c,22,230,.55);ring(x,y,c,110,.45,4);S.shake=Math.min(9,S.shake+5);S.flash=.14;
  blip(good?990:160,.3,'triangle',.08,good?1500:80);},
 sh(x,y){ring(x,y,POW.shield.c,90,.45,4);spark(x,y,POW.shield.c,14,200);S.shake+=3;blip(300,.2,'triangle',.08,900);},
 p(side,k){const P=POW[k];S.announce={t:k,n:P.n,c:P.c,side,l:1.4};spark(W/2,side==='p'?H*.75:H*.25,P.c,18,240,.6);blip(520,.25,'triangle',.08,1040);}};
const r1=v=>typeof v==='number'?Math.round(v*10)/10:v;
function fx(n,...a){FX[n](...a);if(NET.role==='host'&&NET.open&&NET.ev.length<60)NET.ev.push([n,...a.map(r1)]);}
// ---- AI
function aiUpdate(dt){const d=DIFF[S.diff],ai=S.ai,ap=S.aPortal;ai.t-=dt;
 // track the most threatening ball (moving up, closest to top)
 let b=null;for(const x of S.balls)if(x.vy<0&&(!b||x.y<b.y))b=x;const anyb=b||S.balls[0];
 const ghost=has('p','ghost');
 if(ai.t<=0){ai.t=d.react*(ghost?1.6:1);let tx=W/2;
  if(b){let t=(b.y-(AIY+PH))/-b.vy,x=b.x+b.vx*t;const span=W-2*BR;x-=BR;x=((x%(2*span))+2*span)%(2*span);if(x>span)x=2*span-x;tx=x+BR;}
  else if(S.power&&S.orbs.length&&anyb&&anyb.owner==='a'){tx=S.orbs[0].x;}// set up for orb
  ai.tx=tx+(Math.random()-.5)*2*d.err*(ghost?2.5:1);}
 const dx=ai.tx-ai.x,w=padW('a');ai.x+=Math.sign(dx)*Math.min(Math.abs(dx),d.spd*dt);ai.x=Math.max(w/2,Math.min(W-w/2,ai.x));
 if(has('p','lock'))return;
 ap.t-=dt;if(ap.t<=0){ap.t=d.react*2;
  if(anyb&&anyb.vx>0&&Math.random()<d.use){const t=(W-BR-anyb.x)/anyb.vx;ap.ty=anyb.y+anyb.vy*t;}
  else if(anyb&&anyb.vx>0&&anyb.vy>0&&Math.random()<.5)ap.ty=anyb.y;else ap.ty=PMIN+Math.random()*(PMAX-PMIN)*.5;}
 ap.ty=Math.max(PMIN,Math.min(PMAX,ap.ty));const dy=ap.ty-ap.y;ap.y+=Math.sign(dy)*Math.min(Math.abs(dy),d.pspd*dt);}
// ---- online opponent (host side): guest's pointer drives the top paddle + right portal
function remoteUpdate(dt){const ai=S.ai,ap=S.aPortal,w=padW('a');ai.x+=(ai.tx-ai.x)*Math.min(1,dt*25);ai.x=Math.max(w/2,Math.min(W-w/2,ai.x));

function onMsg(m){if(!m||typeof m!=='object')return;NET.last=performance.now();
 switch(m.t){
 case 'in':if(NET.role==='host'){S.ai.tx=Math.max(0,Math.min(W,+m.x||0));S.aPortal.ty=Math.max(PMIN,Math.min(PMAX,+m.y||H/2));}break;
 case 'rm':NET.rm.them=true;if(S.state==='over')$('winS').textContent+=' · Opponent wants a rematch!';checkRematch();break;
 case 'bye':lost('Your opponent left the game.');break;
 case 'full':lost('That room is full.');break;
 case 'pi':netSend({t:'po',ts:m.ts});break;
 case 'po':NET.rtt=performance.now()-m.ts;pill();break;
 case 's':if(NET.role!=='guest')return;onSnap(m);break;}}
function onSnap(d){const now=performance.now();NET.snaps.push({rt:now,d});while(NET.snaps.length>2&&NET.snaps[1].rt<now-1000)NET.snaps.shift();
 for(const e of d.ev||[]){const f=FX[e[0]];if(f)try{f(...e.slice(1))}catch(_){}}
 S.ps=d.ps;S.as=d.as;S.power=!!d.pow;S.combo=d.cb;S.serve=d.sv;
 const pj=JSON.stringify(d.pw);if(pj!==NET.pwj){NET.pwj=pj;S.pw=d.pw;renderHud();}
 if(d.st!==S.state){const prev=S.state;S.state=d.st;
  if(d.st==='play'){NET.rm.me=NET.rm.them=false;show(null);hudOn();if(prev!=='over'){S.ai.tx=S.ai.x=W/2;}}
  else if(d.st==='over')showWin();}
 pill();}
// guest: interpolate host snapshots ~70ms in the past; own paddle/portal are predicted locally for zero-lag feel
function guestTick(dt){const sn=NET.snaps;if(!sn.length)return;const rt=performance.now()-INTERP;let a=sn[0],b=sn[0];
 for(let i=sn.length-1;i>=0;i--)if(sn[i].rt<=rt){a=sn[i];b=sn[i+1]||sn[i];break}
 const k=b===a?0:Math.max(0,Math.min(1,(rt-a.rt)/(b.rt-a.rt))),A=a.d,B=b.d,Lp=(u,v)=>u+(v-u)*k;
 S.player.x=Lp(A.px,B.px);S.player.sq=B.psq;S.ai.sq=B.asq;S.pPortal.y=Lp(A.pp,B.pp);
 const aw=padW('a');S.ai.x+=(S.ai.tx-S.ai.x)*Math.min(1,dt*25);S.ai.x=Math.max(aw/2,Math.min(W-aw/2,S.ai.x));
 if(has('p','lock'))S.aPortal.y=Lp(A.ap,B.ap);else{const dy=S.aPortal.ty-S.aPortal.y;S.aPortal.y+=Math.sign(dy)*Math.min(Math.abs(dy),PORTAL_SPD*dt);}
 const old={};for(const x of S.balls)old[x.id]=x;const am={};for(const x of A.b)am[x[7]]=x;
 S.balls=B.b.map(q=>{const p=am[q[7]],u=p&&Math.abs(p[0]-q[0])<W/2?p:q,o=old[q[7]]||{trail:[]};
  const nb={id:q[7],x:Lp(u[0],q[0]),y:Lp(u[1],q[1]),vx:q[2],vy:q[3],owner:q[4]||null,pt:q[5]?{s:q[5],dy:q[6],g:1}:null,trail:o.trail,cool:0,curve:0,mult:1};
  const sp=speed(nb),tl=sp>800?26:sp>550?20:14;nb.trail.push({x:nb.x,y:nb.y});while(nb.trail.length>tl)nb.trail.shift();return nb});
 const ot={};for(const o of S.orbs)ot[o.k+o.x]=o.t;S.orbs=B.o.map(o=>({k:o[0],x:o[1],y:o[2],l:o[3],t:(ot[o[0]+o[1]]||0)+dt}));
 if(S.announce&&S.state!=='play')S.announce=null;}
function netTick(t){if(!NET.role||!NET.open)return;
 if(NET.role==='host'&&t-NET.lastSend>=33){NET.lastSend=t;netSend(snap());}
 if(NET.role==='guest'&&NET.inDirty&&t-NET.lastIn>=25){NET.lastIn=t;NET.inDirty=false;netSend({t:'in',x:r1(S.ai.tx),y:r1(S.aPortal.ty)});}}
setInterval(()=>{if(!NET.open)return;netSend({t:'pi',ts:performance.now()});if(NET.role==='guest')NET.inDirty=true;
 if(performance.now()-NET.last>8000)lost('Connection lost (no data for 8 s).');},1000);
addEventListener('beforeunload',()=>{if(NET.open)netSend({t:'bye'})});
$('bOnline').onclick=()=>{lobby(false);$('joinCode').value='';setStatus('Create a room and send the code to a friend, or join theirs.');blip(500)};
$('bCreate').onclick=createRoom;$('bJoin').onclick=()=>joinRoom($('joinCode').value);
$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom($('joinCode').value)});
$('bOnBack').onclick=()=>{netClose();show('menu')};$('bDcMenu').onclick=()=>{show('menu')};
$('bCopy').onclick=async()=>{const u=$('roomLink').value;if(!u)return;try{if(navigator.share&&matchMedia('(pointer:coarse)').matches)await navigator.share({title:'Portal Pong',text:'Play Portal Pong with me! Room '+NET.code,url:u});else{await navigator.clipboard.writeText(u);setStatus('Link copied! Waiting for opponent…')}}catch(e){$('roomLink').select()}};
{const q=new URLSearchParams(location.search).get('room');if(q)setTimeout(()=>joinRoom(q),50);}

})();
</script></body></html>
